<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moustapha Shop – Boutique en ligne</title>
<meta name="description" content="Moustapha Shop – sacs, accessoires, maison et beauté. Livraison Casablanca 20 DH, reste du Maroc 35 DH.">
<link rel="icon" href="./favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#080709;color:#f7f2e9;font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:#080709ee;border-bottom:1px solid #29242a;backdrop-filter:blur(12px)}.bar{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800;letter-spacing:.08em}.nav{display:flex;gap:24px;color:#bbb}.nav a:hover{color:#d8b46a}.btn{border:0;border-radius:10px;padding:12px 17px;background:#d8b46a;color:#120f0b;font-weight:800;cursor:pointer}.btn.dark{background:#211d21;color:#fff}.hero{padding:75px 0 55px;text-align:center;background:radial-gradient(circle at 50% 0,#352a1b,transparent 55%)}.hero h1{font-size:clamp(38px,7vw,72px);margin:0 0 16px}.hero p{max-width:650px;margin:0 auto 25px;color:#bdb7ae;line-height:1.7}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.chip{background:#171419;border:1px solid #302b30;color:#ddd;padding:9px 13px;border-radius:99px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:#111012;border:1px solid #29252a;border-radius:16px;overflow:hidden}.pic{height:270px;background:#19171a;display:grid;place-items:center;color:#777}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.price{font-size:20px;font-weight:800;color:#e2c17a}.old{text-decoration:line-through;color:#777;font-size:13px;margin-left:7px}.muted{color:#999;line-height:1.5}.section{padding:35px 0}.cart{position:fixed;right:18px;bottom:18px;z-index:8}.panel{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.panel.open{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #343034;border-radius:18px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #3a343b;background:#19161a;color:#fff;margin:6px 0 12px}.items{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;padding:10px;background:#19161a;border-radius:10px}.item img{width:55px;height:55px;object-fit:cover;border-radius:8px}.admin{display:none}.admin table{width:100%;border-collapse:collapse}.admin td,.admin th{padding:10px;border-bottom:1px solid #302b30;text-align:left}.msg{padding:12px;border-radius:10px;background:#18151a;margin:10px 0}.danger{color:#ff8e8e}.success{color:#9fe0ae}@media(max-width:700px){.nav{display:none}.row{grid-template-columns:1fr}.hero{padding-top:50px}}
</style></head><body>
<header><div class="wrap bar"><a class="logo" href="#/">MOUSTAPHA SHOP</a><nav class="nav"><a href="#/">Accueil</a><a href="#shop">Boutique</a><a href="#contact">Contact</a><a href="#admin">Admin</a></nav><button class="btn" onclick="openCart()">Panier (<span id="count">0</span>)</button></div></header>
<main id="app"></main>
<div class="panel" id="panel"><div class="modal" id="modal"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://hwjbfjvgiquflhbledzd.supabase.co',SB_KEY='sb_publishable_MwnjEVSMNEoYD94tKJhEDA_9795yqbC';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const app=document.querySelector('#app'),panel=document.querySelector('#panel'),modal=document.querySelector('#modal'); let products=[],cats=[],cart=JSON.parse(localStorage.ms_cart||'[]');
const money=n=>new Intl.NumberFormat('fr-MA',{style:'currency',currency:'MAD',maximumFractionDigits:0}).format(Number(n||0));
async function load(){const [c,p]=await Promise.all([sb.from('categories').select('*').eq('is_active',true).order('sort_order'),sb.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false})]);cats=c.data||[];products=p.data||[];render();}
function render(){let hash=location.hash||'#/';if(hash==='#admin'||hash.startsWith('#admin/'))return admin();if(hash==='#shop')return shop();if(hash==='#contact')return contact();home()}
function home(){app.innerHTML='<section class="hero"><div class="wrap"><h1>Moustapha Shop</h1><p>Une sélection soignée de sacs, accessoires, articles pour la maison et beauté, livrée chez vous.</p><a class="btn" href="#shop">Découvrir la boutique</a></div></section><section class="section wrap"><h2>Nos catégories</h2><div class="chips">'+cats.map(c=>'<button class="chip" onclick="filterCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div><div id="homegrid" class="grid">'+cards(products.slice(0,8))+'</div></section>'}
function shop(){app.innerHTML='<section class="section wrap"><h1>Boutique</h1><div class="chips"><button class="chip" onclick="shop()">Tous</button>'+cats.map(c=>'<button class="chip" onclick="filterCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div><div id="grid" class="grid">'+cards(products)+'</div></section>'}
function filterCat(id){const list=products.filter(p=>p.category_id===id);const g=document.querySelector('#grid,#homegrid');if(g)g.innerHTML=cards(list)}
function cards(list){if(!list.length)return '<div class="msg">Aucun produit disponible pour le moment.</div>';return list.map(p=>'<article class="card"><div class="pic">'+(p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'">':'<span>Moustapha Shop</span>')+'</div><div class="body"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||'')+'</p><div><span class="price">'+money(p.price)+'</span>'+(p.old_price?'<span class="old">'+money(p.old_price)+'</span>':'')+'</div><button class="btn" style="margin-top:12px" onclick="add(\''+p.id+'\')">Ajouter au panier</button></div></article>').join('')}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.stock)return alert('Stock insuffisant');x.qty++}else cart.push({id,qty:1});save();alert('Produit ajouté au panier.')}
function save(){localStorage.ms_cart=JSON.stringify(cart);document.querySelector('#count').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){let rows=cart.map(x=>{const p=products.find(p=>p.id===x.id);return p?'<div class="item"><div style="flex:1"><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' × '+x.qty+'</div></div><button class="btn dark" onclick="removeCart(\''+x.id+'\')">×</button></div>':''}).join('');let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);modal.innerHTML='<h2>Votre panier</h2><div class="items">'+(rows||'<p class="muted">Panier vide.</p>')+'</div><hr><h3>Total produits: '+money(total)+'</h3>'+(cart.length?'<button class="btn" onclick="checkout()">Commander</button>':'')+' <button class="btn dark" onclick="closePanel()">Fermer</button>';panel.classList.add('open')}
function removeCart(id){cart=cart.filter(x=>x.id!==id);save();openCart()}
function checkout(){modal.innerHTML='<h2>Finaliser la commande</h2><div class="row"><label>Nom<input class="input" id="n"></label><label>Téléphone<input class="input" id="p"></label></div><div class="row"><label>Ville<input class="input" id="c"></label><label>Adresse<input class="input" id="a"></label></div><label>Note<textarea class="input" id="note"></textarea></label><button class="btn" onclick="sendOrder()">Confirmer la commande</button> <button class="btn dark" onclick="openCart()">Retour</button>'}
async function sendOrder(){const name=n.value.trim(),phone=p.value.trim(),city=c.value.trim(),address=a.value.trim();if(!name||!phone||!city||!address)return alert('Veuillez remplir les champs obligatoires.');const items=cart.map(x=>({product_id:x.id,quantity:x.qty}));const {data,error}=await sb.rpc('create_order',{p_name:name,p_phone:phone,p_city:city,p_address:address,p_notes:note.value.trim()||null,p_items:items});if(error)return alert(error.message);cart=[];save();modal.innerHTML='<div class="msg success"><h2>Commande confirmée</h2><p>Numéro: <b>'+esc(data.order_number)+'</b></p><p>Total: <b>'+money(data.total)+'</b></p></div><button class="btn" onclick="closePanel()">Fermer</button>'}
function contact(){app.innerHTML='<section class="section wrap"><h1>Contact</h1><p class="muted">Casablanca, Hay El Hassani, Rue 80</p><p><a class="btn" href="https://wa.me/212664624776" target="_blank">WhatsApp</a> <a class="btn dark" href="tel:+212664624776">+212 664-624776</a></p><p class="muted">Livraison Casablanca : 20 DH · Hors Casablanca : 35 DH</p></section>'}
async function admin(){const s=(await sb.auth.getSession()).data.session;if(!s){app.innerHTML='<section class="section wrap admin" style="display:block"><h1>Admin</h1><input class="input" id="em" placeholder="Email"><input class="input" id="pw" type="password" placeholder="Mot de passe"><button class="btn" onclick="login()">Connexion</button><p class="muted">Compte admin Supabase requis.</p></section>';return}const {data}=await sb.from('admin_users').select('user_id').eq('user_id',s.user.id).maybeSingle();if(!data){await sb.auth.signOut();return admin()}app.innerHTML='<section class="section wrap admin" style="display:block"><h1>Administration</h1><p>Connecté: '+esc(s.user.email||'')+'</p><button class="btn" onclick="location.hash=\'#admin/products\'">Produits</button> <button class="btn dark" onclick="logout()">Déconnexion</button><h2>Commandes</h2><div id="orders">Chargement…</div></section>';loadOrders()}
async function login(){const {error}=await sb.auth.signInWithPassword({email:em.value,password:pw.value});if(error)return alert(error.message);admin()}
async function logout(){await sb.auth.signOut();admin()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);document.querySelector('#orders').innerHTML=error?'<p class="danger">'+esc(error.message)+'</p>':(data||[]).map(o=>'<div class="msg"><b>'+esc(o.order_number)+'</b> · '+esc(o.customer_name)+' · '+money(o.total)+' · '+esc(o.status)+'</div>').join('')||'<p class="muted">Aucune commande.</p>'}
function closePanel(){panel.classList.remove('open')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.addEventListener('hashchange',render);window.openCart=openCart;window.closePanel=closePanel;window.add=add;window.removeCart=removeCart;window.checkout=checkout;window.sendOrder=sendOrder;window.filterCat=filterCat;window.login=login;window.logout=logout;window.shop=shop;
save();load();
</script></body></html>
