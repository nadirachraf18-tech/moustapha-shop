.categories{padding:25px 0;background:#fff}.catgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:14px}.cat{border:0;background:transparent;text-align:center;cursor:pointer}.catpic{width:92px;height:92px;border-radius:50%;background:#fde8ef;margin:auto auto 9px;display:grid;place-items:center;font-size:36px}.cat b{font-size:14px}
.section{padding:45px 0}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.sectionTitle h2{font-size:32px;margin:0}.sectionTitle p{color:#777;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{background:#fff;border:1px solid #eee;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px #0000000b}.pic{height:280px;background:#f7f4f5;display:grid;place-items:center;color:#999}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.price{font-size:20px;font-weight:800;color:#e9236d}.old{text-decoration:line-through;color:#888;font-size:13px;margin-left:7px}.muted{color:#777;line-height:1.5}.btn{border:0;border-radius:10px;padding:12px 17px;background:#ed2870;color:#fff;font-weight:800;cursor:pointer}.btn.dark{background:#211d21;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.chip{background:#fde8ef;border:1px solid #f7bfd2;color:#9e1d4f;padding:9px 13px;border-radius:99px;cursor:pointer}
.cart{position:fixed;right:18px;bottom:18px;z-index:30}.panel{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.panel.open{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #eee;border-radius:18px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#111;margin:6px 0 12px}.items{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;padding:10px;background:#faf7f8;border-radius:10px}.item img{width:55px;height:55px;object-fit:cover;border-radius:8px}.admin{display:none}.admin table{width:100%;border-collapse:collapse}.admin td,.admin th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.msg{padding:12px;border-radius:10px;background:#faf3f6;margin:10px 0}.danger{color:#c00}.success{color:#16803a}

<script>
const SB_URL='https://hwjbfjvgiquflhbledzd.supabase.co',SB_KEY='sb_publishable_MwnjEVSMNEoYD94tKJhEDA_9795yqbC';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const app=document.querySelector('#app'),panel=document.querySelector('#panel'),modal=document.querySelector('#modal'); let products=[],cats=[],cart=JSON.parse(localStorage.ms_cart||'[]');
const money=n=>new Intl.NumberFormat('fr-MA',{style:'currency',currency:'MAD',maximumFractionDigits:0}).format(Number(n||0));
async function load(){const [c,p]=await Promise.all([sb.from('categories').select('*').eq('is_active',true).order('sort_order'),sb.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false})]);cats=c.data||[];products=p.data||[];render();}
function render(){let hash=location.hash||'#/';if(hash==='#admin/products')return adminProducts();if(hash==='#admin'||hash.startsWith('#admin/'))return admin();if(hash==='#shop')return shop();if(hash==='#contact')return contact();home()}
function home(){app.innerHTML='<section class="hero"><div class="wrap"><div class="heroText"><p class="script">Votre Style</p><h1>Notre Passion</h1><p>Des vêtements, chaussures et sacs tendance pour toutes les femmes.</p><a class="heroBtn" href="#shop">Découvrir maintenant →</a><div class="services"><div class="service"><i>🚚</i><span><b>Livraison rapide</b><br>Partout au Maroc</span></div><div class="service"><i>🛡</i><span><b>Paiement</b><br>à la livraison</span></div><div class="service"><i>🎧</i><span><b>Service client</b><br>7j/7</span></div></div></div></div></section><section class="categories"><div class="wrap"><div class="catgrid">'+cats.slice(0,9).map((c,i)=>'<button class="cat" onclick="filterCat(\''+c.id+'\')"><div class="catpic">'+['👗','👚','🧥','👖','👟','👜','🕶️','💄','🎁'][i]+'</div><b>'+esc(c.name)+'</b></button>').join('')+'</div></div></section><section class="section wrap"><div class="sectionTitle"><div><h2>Nouveautés</h2><p>Découvrez nos dernières arrivées</p></div><a class="btn dark" href="#shop">Voir tout →</a></div><div id="homegrid" class="grid">'+cards(products.slice(0,8))+'</div></section>'}
function shop(){app.innerHTML='<section class="section wrap"><div class="sectionTitle"><div><h1>Boutique</h1><p>Découvrez tous nos produits</p></div></div><div class="chips"><button class="chip" onclick="shop()">Tous</button>'+cats.map(c=>'<button class="chip" onclick="filterCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div><div id="grid" class="grid">'+cards(products)+'</div></section>'}
function cards(list){if(!list.length)return '<div class="msg">Aucun produit disponible pour le moment.</div>';return list.map(p=>'<article class="card"><div class="pic">'+(p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'">':'<span>Moustapha Shop</span>')+'</div><div class="body"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||'')+'</p><div><span class="price">'+money(p.price)+'</span>'+(p.old_price?'<span class="old">'+money(p.old_price)+'</span>':'')+'</div><button class="btn" style="margin-top:12px" onclick="add(\''+p.id+'\')">Ajouter au panier</button></div></article>').join('')}
function filterCat(id){const list=products.filter(p=>p.category_id===id);const g=document.querySelector('#grid,#homegrid');if(g)g.innerHTML=cards(list)}
function searchProducts(q){q=q.toLowerCase();const list=products.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q));const g=document.querySelector('#grid,#homegrid');if(g)g.innerHTML=cards(list)}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.stock)return alert('Stock insuffisant');x.qty++}else cart.push({id,qty:1});save();alert('Produit ajouté au panier.')}
function save(){localStorage.ms_cart=JSON.stringify(cart);const el=document.querySelector('#count');if(el)el.textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){let rows=cart.map(x=>{const p=products.find(p=>p.id===x.id);return p?'<div class="item"><div style="flex:1"><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' × '+x.qty+'</div></div><button class="btn dark" onclick="removeCart(\''+x.id+'\')">×</button></div>':''}).join('');let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);modal.innerHTML='<h2>Votre panier</h2><div class="items">'+(rows||'<p class="muted">Panier vide.</p>')+'</div><hr><h3>Total produits: '+money(total)+'</h3>'+(cart.length?'<button class="btn" onclick="checkout()">Commander</button>':'')+' <button class="btn dark" onclick="closePanel()">Fermer</button>';panel.classList.add('open')}
function removeCart(id){cart=cart.filter(x=>x.id!==id);save();openCart()}
function checkout(){modal.innerHTML='<h2>Finaliser la commande</h2><div class="row"><label>Nom<input class="input" id="n"></label><label>Téléphone<input class="input" id="p"></label></div><div class="row"><label>Ville<input class="input" id="c"></label><label>Adresse<input class="input" id="a"></label></div><label>Note<textarea class="input" id="note"></textarea></label><button class="btn" onclick="sendOrder()">Confirmer la commande</button> <button class="btn dark" onclick="openCart()">Retour</button>'}
async function sendOrder(){const name=document.querySelector('#n').value.trim(),phone=document.querySelector('#p').value.trim(),city=document.querySelector('#c').value.trim(),address=document.querySelector('#a').value.trim();if(!name||!phone||!city||!address)return alert('Veuillez remplir les champs obligatoires.');const items=cart.map(x=>({product_id:x.id,quantity:x.qty}));const {data,error}=await sb.rpc('create_order',{p_name:name,p_phone:phone,p_city:city,p_address:address,p_notes:document.querySelector('#note').value.trim()||null,p_items:items});if(error)return alert(error.message);cart=[];save();modal.innerHTML='<div class="msg success"><h2>Commande confirmée</h2><p>Numéro: <b>'+esc(data.order_number)+'</b></p><p>Total: <b>'+money(data.total)+'</b></p></div><button class="btn" onclick="closePanel()">Fermer</button>'}
function contact(){app.innerHTML='<section class="section wrap"><h1>Contact</h1><p class="muted">Casablanca, Hay El Hassani, Rue 80</p><p><a class="btn" href="https://wa.me/212664624776" target="_blank">WhatsApp</a> <a class="btn dark" href="tel:+212664624776">+212 664-624776</a></p><p class="muted">Livraison Casablanca : 20 DH · Hors Casablanca : 35 DH</p></section>'}
async function adminProducts(){
  const s=(await sb.auth.getSession()).data.session;
  if(!s){location.hash='#admin';return}
  const {data:isA}=await sb.from('admin_users').select('user_id').eq('user_id',s.user.id).maybeSingle();
  if(!isA){await sb.auth.signOut();location.hash='#admin';return}
  const {data:ps,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
  const list=ps||[];
  app.innerHTML='<section class="section wrap admin" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h1>Produits</h1><div><button class="btn" onclick="productForm()">+ Ajouter produit</button> <button class="btn dark" onclick="location.hash=\'#admin\'">← Commandes</button></div></div><div id="productList" class="grid" style="margin-top:20px">'+(error?'<p class="danger">'+esc(error.message)+'</p>':list.map(productAdminCard).join('')||'<p class="muted">Aucun produit.</p>')+'</div></section>';
}
function productAdminCard(p){
  const img=p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'" style="width:100%;height:220px;object-fit:cover">':'<div class="pic">Aucune image</div>';
  return '<article class="card"><div>'+img+'</div><div class="body"><h3>'+esc(p.name)+'</h3><p><b>'+money(p.price)+'</b> · Stock: '+p.stock+'</p><p class="muted">'+esc(p.description||'')+'</p><p class="muted">Tailles: '+esc((p.sizes||[]).join(', ')||'—')+' · Couleurs: '+esc((p.colors||[]).join(', ')||'—')+'</p><p>'+(p.is_active?'<span class="success">Actif</span>':'<span class="danger">Inactif</span>')+(p.is_featured?' · ⭐ Vedette':'')+(p.is_new?' · 🆕 Nouveau':'')+'</p><button class="btn" onclick="productForm(\''+p.id+'\')">Modifier</button> <button class="btn dark" onclick="toggleProduct(\''+p.id+'\','+(!p.is_active)+')">'+(p.is_active?'Désactiver':'Activer')+'</button> <button class="btn dark" onclick="deleteProduct(\''+p.id+'\')">Supprimer</button></div></article>';
}
async function productForm(id){
  let p={name:'',description:'',price:'',old_price:'',category_id:'',stock:0,images:[],video_url:'',colors:[],sizes:[],is_active:true,is_new:false,is_featured:false};
  if(id){const {data}=await sb.from('products').select('*').eq('id',id).single();if(data)p=data}
  const catOptions='<option value="">Sans catégorie</option>'+cats.map(c=>'<option value="'+c.id+'" '+(p.category_id===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('');
  app.innerHTML='<section class="section wrap admin" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><h1>'+(id?'Modifier produit':'Ajouter produit')+'</h1><button class="btn dark" onclick="location.hash=\'#admin/products\'">Retour</button></div><div class="modal" style="max-width:900px;margin:20px 0"><div class="row"><label>Nom<input class="input" id="pn" value="'+esc(p.name)+'"></label><label>Catégorie<select class="input" id="pc">'+catOptions+'</select></label></div><label>Description<textarea class="input" id="pd">'+esc(p.description||'')+'</textarea></label><div class="row"><label>Prix DH<input class="input" type="number" id="pp" value="'+p.price+'"></label><label>Ancien prix<input class="input" type="number" id="po" value="'+(p.old_price??'')+'"></label></div><div class="row"><label>Stock<input class="input" type="number" id="ps" value="'+p.stock+'"></label><label>Vidéo <input class="input" type="file" id="pvideo" accept="video/*"></label></div><label>Tailles <input class="input" id="pz" value="'+esc((p.sizes||[]).join(', '))+'" placeholder="S, M, L, XL"></label><label>Couleurs <input class="input" id="pcol" value="'+esc((p.colors||[]).join(', '))+'" placeholder="Noir, Beige, Rose"></label><label>📸 Photos du produit <input class="input" type="file" id="pfiles" accept="image/*" multiple></label><div class="msg">Choisis directement les photos et la vidéo depuis ton iPhone. Elles seront envoyées automatiquement au stockage.</div><label><input type="checkbox" id="pa" '+(p.is_active?'checked':'')+'> Actif</label> <label><input type="checkbox" id="pnw" '+(p.is_new?'checked':'')+'> Nouveau</label> <label><input type="checkbox" id="pf" '+(p.is_featured?'checked':'')+'> Vedette</label><br><button class="btn" style="margin-top:15px" onclick="saveProduct('+(id?"'"+id+"'":"null")+')">Enregistrer</button></div></section>';
}
async function uploadMedia(file,folder){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  const {error}=await sb.storage.from('media').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  const {data}=sb.storage.from('media').getPublicUrl(path);
  return data.publicUrl;
}
async function saveProduct(id){
  const name=document.querySelector('#pn').value.trim(),price=Number(document.querySelector('#pp').value),stock=Math.max(0,Number(document.querySelector('#ps').value||0));
  if(!name||!price)return alert('Nom et prix obligatoires.');
  const btn=document.querySelector('button[onclick^="saveProduct"]'); if(btn){btn.disabled=true;btn.textContent='Envoi...'}
  try{
    const imageFiles=[...(document.querySelector('#pfiles').files||[])];
    const videoFile=document.querySelector('#pvideo').files?.[0];
    const uploadedImages=[];
    for(const f of imageFiles) uploadedImages.push(await uploadMedia(f,'products'));
    let videoUrl=null;
    if(videoFile) videoUrl=await uploadMedia(videoFile,'videos');
    const payload={name,description:document.querySelector('#pd').value.trim(),price,old_price:document.querySelector('#po').value?Number(document.querySelector('#po').value):null,category_id:document.querySelector('#pc').value||null,stock,video_url:videoUrl,colors:document.querySelector('#pcol').value.split(',').map(x=>x.trim()).filter(Boolean),sizes:document.querySelector('#pz').value.split(',').map(x=>x.trim()).filter(Boolean),images:uploadedImages,is_active:document.querySelector('#pa').checked,is_new:document.querySelector('#pnw').checked,is_featured:document.querySelector('#pf').checked};
    const q=id?sb.from('products').update(payload).eq('id',id):sb.from('products').insert(payload);
    const {error}=await q;if(error)throw error;
    alert('Produit enregistré avec succès.');
    location.hash='#admin/products';
  }catch(e){
    alert('Erreur upload/enregistrement: '+(e.message||e));
    if(btn){btn.disabled=false;btn.textContent='Enregistrer'}
  }
}
async function toggleProduct(id,value){const {error}=await sb.from('products').update({is_active:value}).eq('id',id);if(error)return alert(error.message);adminProducts()}
async function deleteProduct(id){if(!confirm('Supprimer ce produit ?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)return alert(error.message);adminProducts()}
async function admin(){const s=(await sb.auth.getSession()).data.session;if(!s){app.innerHTML='<section class="section wrap admin" style="display:block"><h1>Admin</h1><input class="input" id="em" placeholder="Email"><input class="input" id="pw" type="password" placeholder="Mot de passe"><button class="btn" onclick="login()">Connexion</button><p class="muted">Compte admin Supabase requis.</p></section>';return}const {data}=await sb.from('admin_users').select('user_id').eq('user_id',s.user.id).maybeSingle();if(!data){await sb.auth.signOut();return admin()}app.innerHTML='<section class="section wrap admin" style="display:block"><h1>Administration</h1><p>Connecté: '+esc(s.user.email||'')+'</p><button class="btn" onclick="location.hash=\'#admin/products\'">Produits</button> <button class="btn dark" onclick="logout()">Déconnexion</button><h2>Commandes</h2><div id="orders">Chargement…</div></section>';loadOrders()}
async function login(){const {error}=await sb.auth.signInWithPassword({email:em.value,password:pw.value});if(error)return alert(error.message);const {data:claimed,error:claimError}=await sb.rpc('claim_first_admin');if(claimError)return alert(claimError.message);if(!claimed)return alert('Ce compte n’est pas administrateur.');admin()}
async function logout(){await sb.auth.signOut();admin()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);document.querySelector('#orders').innerHTML=error?'<p class="danger">'+esc(error.message)+'</p>':(data||[]).map(o=>'<div class="msg"><b>'+esc(o.order_number)+'</b> · '+esc(o.customer_name)+' · '+money(o.total)+' · '+esc(o.status)+'</div>').join('')||'<p class="muted">Aucune commande.</p>'}
function closePanel(){panel.classList.remove('open')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
