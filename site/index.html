const video=document.querySelector('#heroProductVideo');if(!video)return;

}

async function uploadMedia(file,folder){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  const {error}=await sb.storage.from('media').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  const {data}=sb.storage.from('media').getPublicUrl(path);
  return data.publicUrl;
}
async function saveProduct(id){
 const existing=window.currentEditProduct||{};
 const name=document.querySelector('#pn').value.trim(),price=Number(document.querySelector('#pp').value);
 const colors=parseOptions(document.querySelector('#pcol').value),sizes=parseOptions(document.querySelector('#pz').value);
 if(!name||!price)return alert('Nom et prix obligatoires.');
 const inputs=[...document.querySelectorAll('.variantStockInput')];
 let variant_stock={};let stock=0;
 if(colors.length||sizes.length){
  if(!inputs.length)return alert('Ajoutez les variantes puis actualisez le tableau.');
  for(const input of inputs){
   if(input.value===''||!Number.isInteger(Number(input.value))||Number(input.value)<0)return alert('Remplissez le stock de chaque combinaison couleur / taille avec un nombre positif ou zéro.');
   const key=input.dataset.stockKey;variant_stock[key]=Number(input.value);stock+=Number(input.value);
  }
 }else{stock=Math.max(0,Number(document.querySelector('#ps').value||0));variant_stock={};}
 const btn=document.querySelector('button[onclick^="saveProduct"]');if(btn){btn.disabled=true;btn.textContent='Envoi...'}
 try{
  const imageFiles=[...(document.querySelector('#pfiles').files||[])],videoFiles=[...(document.querySelector('#pvideo').files||[])];
  const uploadedImages=[],uploadedVideos=[];const color_images={...(existing.color_images||{})};for(const input of document.querySelectorAll('.colorImageInput')){const color=input.dataset.color,file=input.files?.[0];if(file)color_images[color]=await uploadMedia(file,'products/colors');else if(!colors.includes(color))delete color_images[color];}
  for(const f of imageFiles)uploadedImages.push(await uploadMedia(f,'products'));
  for(const f of videoFiles)uploadedVideos.push(await uploadMedia(f,'videos'));
  const priorVideos=Array.isArray(existing.videos)?existing.videos:(existing.video_url?[existing.video_url]:[]);
  const allVideos=uploadedVideos.length?[...priorVideos,...uploadedVideos]:priorVideos;
  const payload={name,description:document.querySelector('#pd').value.trim(),price,old_price:document.querySelector('#po').value?Number(document.querySelector('#po').value):null,category_id:document.querySelector('#pc').value||null,stock,variant_stock,video_url:allVideos[0]||existing.video_url||null,videos:allVideos,colors,sizes,images:uploadedImages.length?[...(existing.images||[]),...uploadedImages]:(existing.images||[]),color_images,is_active:document.querySelector('#pa').checked,is_new:document.querySelector('#pnw').checked,is_featured:document.querySelector('#pf').checked};
  const q=id?sb.from('products').update(payload).eq('id',id):sb.from('products').insert(payload);
  const {error}=await q;if(error)throw error;
  alert('Produit et stock par couleur / taille enregistrés.');
  location.hash='#admin/products';
 }catch(e){alert('Erreur upload/enregistrement: '+(e.message||e));if(btn){btn.disabled=false;btn.textContent='Enregistrer'}}
}

async function adminCategories(){const s=(await sb.auth.getSession()).data.session;if(!s){location.hash='#admin';return}const {data:isA}=await sb.from('admin_users').select('user_id').eq('user_id',s.user.id).maybeSingle();if(!isA){location.hash='#admin';return}const {data:list,error}=await sb.from('categories').select('*').order('sort_order').order('name');app.innerHTML='<section class="section wrap admin" style="display:block"><div class="adminHead"><h1>🏷 Catégories</h1><a class="btn dark" href="#admin">← Dashboard</a></div><div class="modal" style="max-width:760px;margin:20px 0"><h2>Ajouter une catégorie</h2><div class="row"><input class="input" id="catName" placeholder="Ex: Chaussures"><input class="input" id="catSort" type="number" value="0" placeholder="Ordre"></div><button class="btn" onclick="saveCategory()">+ Ajouter</button></div><div class="grid">'+(error?'<p class="danger">'+esc(error.message)+'</p>':(list||[]).map(c=>'<article class="card"><div class="body"><h3>'+esc(c.name)+'</h3><p class="muted">Ordre: '+c.sort_order+' · '+(c.is_active?'Active':'Inactive')+'</p><button class="btn" onclick="editCategory(\''+c.id+'\',\''+esc(c.name)+'\','+c.sort_order+')">Modifier</button> <button class="btn dark" onclick="toggleCategory(\''+c.id+'\','+(!c.is_active)+')">'+(c.is_active?'Désactiver':'Activer')+'</button> <button class="btn dark" onclick="deleteCategory(\''+c.id+'\')">Supprimer</button></div></article>').join('')||'<p class="muted">Aucune catégorie.</p>')+'</div></section>'}
async function saveCategory(id){const name=(document.querySelector('#catName')?.value||'').trim();const sort=Number(document.querySelector('#catSort')?.value||0);if(!name)return alert('Nom obligatoire.');const q=id?sb.from('categories').update({name,sort_order:sort}).eq('id',id):sb.from('categories').insert({name,sort_order:sort,is_active:true});const {error}=await q;if(error)return alert(error.message);adminCategories()}
async function editCategory(id,name,sort){app.innerHTML='<section class="section wrap admin" style="display:block"><div class="adminHead"><h1>Modifier catégorie</h1><a class="btn dark" href="#admin/categories">Retour</a></div><div class="modal" style="max-width:700px"><input class="input" id="catName" value="'+esc(name)+'"><input class="input" id="catSort" type="number" value="'+sort+'"><button class="btn" onclick="saveCategory(\''+id+'\')">Enregistrer</button></div></section>'}
async function toggleCategory(id,value){const {error}=await sb.from('categories').update({is_active:value}).eq('id',id);if(error)return alert(error.message);adminCategories()}
async function deleteCategory(id){const {count}=await sb.from('products').select('*',{count:'exact',head:true}).eq('category_id',id);if(Number(count||0)>0)return alert('Cette catégorie contient des produits. Désactive-la ou change la catégorie des produits avant suppression.');if(!confirm('Supprimer cette catégorie ?'))return;const {error}=await sb.from('categories').delete().eq('id',id);if(error)return alert(error.message);adminCategories()}

function parseOptions(v){return String(v||'').split(/[,;|\n]+/).map(x=>x.trim()).filter(Boolean)}
function closePanel(){panel.classList.remove('open')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
