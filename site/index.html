*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#fff;color:#171116;font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1380px;margin:auto;padding:0 28px}

.nav{background:#0b080a;color:#fff;border-top:1px solid #292127}.navin{height:62px;display:flex;align-items:center;gap:24px;justify-content:center;font-weight:700;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.navin::-webkit-scrollbar{display:none}.navin a{padding:12px 18px;border-radius:25px}.navin a:hover,.navin a.active{background:#ed2870}
.hero{min-height:500px;background:linear-gradient(90deg,#080709 0%,#0e080c 45%,#421320 100%);color:#fff;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:0;top:0;width:58%;height:100%;background:radial-gradient(circle at 50% 40%,#df3b77aa,transparent 48%),linear-gradient(120deg,transparent,#6e1d3c);opacity:.9}.hero .wrap{position:relative;z-index:1;min-height:500px;display:flex;align-items:center}.heroText{max-width:620px;padding:60px 0}.script{font-size:58px;font-family:cursive;color:#f33d80;margin:0}.hero h1{font-size:60px;margin:0 0 14px}.hero p{font-size:19px;color:#eee;line-height:1.6;max-width:560px}.heroBtn{display:inline-block;background:#ed2870;color:#fff;padding:17px 28px;border-radius:30px;font-weight:800;box-shadow:0 8px 30px #ed287055}.services{display:flex;gap:32px;margin-top:30px}.service{display:flex;gap:10px;align-items:center}.service i{font-size:28px;color:#f02b73}
.categories{padding:25px 0;background:#fff}.catgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:14px}.cat{border:0;background:transparent;text-align:center;cursor:pointer}.catpic{width:92px;height:92px;border-radius:50%;background:#fde8ef;margin:auto auto 9px;display:grid;place-items:center;font-size:36px}.cat b{font-size:14px}
.section{padding:45px 0}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.sectionTitle h2{font-size:32px;margin:0}.sectionTitle p{color:#777;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{background:#fff;border:1px solid #eee;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px #0000000b}.pic{height:280px;background:#f7f4f5;display:grid;place-items:center;color:#999}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.price{font-size:20px;font-weight:800;color:#e9236d}.old{text-decoration:line-through;color:#888;font-size:13px;margin-left:7px}.muted{color:#777;line-height:1.5}.btn{border:0;border-radius:10px;padding:12px 17px;background:#ed2870;color:#fff;font-weight:800;cursor:pointer}.btn.dark{background:#211d21;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.chip{background:#fde8ef;border:1px solid #f7bfd2;color:#9e1d4f;padding:9px 13px;border-radius:99px;cursor:pointer}
.cart{position:fixed;right:18px;bottom:18px;z-index:30}.panel{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.panel.open{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #eee;border-radius:18px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#111;margin:6px 0 12px}.items{display:grid;gap:10px}.item{display:flex;gap:12px;align-items:center;padding:10px;background:#faf7f8;border-radius:10px}.item img{width:55px;height:55px;object-fit:cover;border-radius:8px}.admin{display:none}.adminHead{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.adminNav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.adminStats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid #eee;border-radius:15px;padding:22px;box-shadow:0 5px 20px #0000000b}.stat b{display:block;font-size:30px;color:#ed2870}.stat span{color:#777}.orderRow{width:100%;border:1px solid #eee;text-align:left;cursor:pointer}.admin table{width:100%;border-collapse:collapse}.admin td,.admin th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.msg{padding:12px;border-radius:10px;background:#faf3f6;margin:10px 0}.danger{color:#c00}.success{color:#16803a}
@media(max-width:900px){.topitems{display:none}.bar{height:85px}.logoimg{width:190px}.actions{gap:10px}.navin{gap:6px;overflow:auto;justify-content:flex-start}.catgrid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:42px}.script{font-size:42px}.hero:after{width:45%;opacity:.55}}

</style></head><body>
<div class="top"><div class="wrap topbar"><div class="topitems"><div class="topitem"><span class="pink">🚚</span> Livraison partout au Maroc</div><div class="topitem"><span class="pink">🎧</span> Service client 7j/7</div><div class="topitem"><span class="pink">🛡</span> Paiement à la livraison</div></div><div>Instagram · TikTok · Facebook · ☎ +212 664-624776</div></div></div>
<header><div class="wrap bar"><a class="logo" href="#/"><img class="logoimg" src="./logo.svg" alt="Moustapha Shop" id="siteLogo"></a><div class="search"><input placeholder="Rechercher un produit..." oninput="searchProducts(this.value)"><button>⌕</button></div><div class="actions"><a class="action" href="#admin"><b>♙</b><span>Compte / Admin</span></a><div class="action"><b>♡</b><span>Favoris</span></div><button class="cartbtn" onclick="openCart()">🛒 <span id="count">0</span></button></div></div></header>
<div class="nav"><div class="wrap navin"><a href="#/" class="active">Accueil</a><a href="#shop">Nouveautés</a><a href="#shop">Vêtements</a><a href="#shop">Chaussures</a><a href="#shop">Sacs</a><a href="#shop">Accessoires</a><a href="#shop">Promotions</a><a href="#contact">À propos</a><a href="#contact">Contact</a></div></div>
<main id="app"></main>
<div class="panel" id="panel"><div class="modal" id="modal"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://hwjbfjvgiquflhbledzd.supabase.co',SB_KEY='sb_publishable_MwnjEVSMNEoYD94tKJhEDA_9795yqbC';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const app=document.querySelector('#app'),panel=document.querySelector('#panel'),modal=document.querySelector('#modal'); let products=[],cats=[],settings={},cart=JSON.parse(localStorage.ms_cart||'[]');
const setting=(k,f='')=>settings[k]??f;
function applyTheme(){let old=document.querySelector('#dynamicTheme');if(old)old.remove();const pink=setting('primary_color','#ed2870'),gold=setting('accent_color','#d4af37');const st=document.createElement('style');st.id='dynamicTheme';st.textContent=`.navin a:hover,.navin a.active,.heroBtn,.btn:not(.dark),.search button,.cartbtn{background:${pink}!important}.price{color:${pink}!important}.pink,.service i{color:${pink}!important}.chip{background:${pink}12!important;border-color:${pink}55!important;color:${pink}!important}.hero:after{background:radial-gradient(circle at 50% 40%,${pink}aa,transparent 48%),linear-gradient(120deg,transparent,${gold}55)!important}.logoimg{filter:drop-shadow(0 0 10px ${pink}22)}`;document.head.appendChild(st);}
function siteText(){document.title=setting('shop_name','Moustapha Shop')+' – Boutique en ligne';const top=document.querySelector('.topbar>div:last-child');if(top)top.innerHTML=(setting('instagram_url')?'Instagram':'')+' · '+(setting('tiktok_url')?'TikTok':'')+' · '+(setting('facebook_url')?'Facebook':'')+' · ☎ '+esc(setting('phone','+212 664-624776'));const logo=document.querySelector('#siteLogo');if(logo&&setting('logo_url'))logo.src=setting('logo_url');}
const money=n=>new Intl.NumberFormat('fr-MA',{style:'currency',currency:'MAD',maximumFractionDigits:0}).format(Number(n||0));
async function load(){const [c,p,s]=await Promise.all([sb.from('categories').select('*').eq('is_active',true).order('sort_order'),sb.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false}),sb.from('site_settings').select('key,value')]);cats=c.data||[];products=p.data||[];settings=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));applyTheme();siteText();render();}
function render(){let hash=location.hash||'#/';if(hash==='#admin/settings')return adminSettings();if(hash==='#admin/products')return adminProducts();if(hash==='#admin/categories')return adminCategories();if(hash==='#admin/orders')return adminOrders();if(hash==='#admin'||hash.startsWith('#admin/'))return admin();if(hash==='#shop')return shop();if(hash==='#contact')return contact();home()}
function home(){app.innerHTML='<section class="hero"><div class="wrap"><div class="heroText"><p class="script">'+esc(setting('hero_title','Votre Style'))+'</p><h1>'+esc(setting('hero_subtitle','Notre Passion'))+'</h1><p>'+esc(setting('hero_description','Des vêtements, chaussures et sacs tendance pour toutes les femmes.'))+'</p><a class="heroBtn" href="#shop">Découvrir maintenant →</a><div class="services"><div class="service"><i>🚚</i><span><b>Livraison rapide</b><br>Partout au Maroc</span></div><div class="service"><i>🛡</i><span><b>Paiement</b><br>à la livraison</span></div><div class="service"><i>🎧</i><span><b>Service client</b><br>7j/7</span></div></div></div></div></section><section class="categories"><div class="wrap"><div class="catgrid">'+cats.slice(0,9).map((c,i)=>'<button class="cat" onclick="filterCat(\''+c.id+'\')"><div class="catpic">'+['👗','👚','🧥','👖','👟','👜','🕶️','💄','🎁'][i]+'</div><b>'+esc(c.name)+'</b></button>').join('')+'</div></div></section><section class="section wrap"><div class="sectionTitle"><div><h2>Nouveautés</h2><p>Découvrez nos dernières arrivées</p></div><a class="btn dark" href="#shop">Voir tout →</a></div><div id="homegrid" class="grid">'+cards(products.slice(0,8))+'</div></section>'}
function shop(){app.innerHTML='<section class="section wrap"><div class="sectionTitle"><div><h1>Boutique</h1><p>Découvrez tous nos produits</p></div></div><div class="chips"><button class="chip" onclick="shop()">Tous</button>'+cats.map(c=>'<button class="chip" onclick="filterCat(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')+'</div><div id="grid" class="grid">'+cards(products)+'</div></section>'}
function cards(list){if(!list.length)return '<div class="msg">Aucun produit disponible pour le moment.</div>';return list.map(p=>'<article class="card"><div class="pic" onclick="productDetails(\''+p.id+'\')" style="cursor:pointer">'+(p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'">':'<span>Moustapha Shop</span>')+'</div><div class="body"><h3>'+esc(p.name)+'</h3><div><span class="price">'+money(p.price)+'</span>'+(p.old_price?'<span class="old">'+money(p.old_price)+'</span>':'')+'</div><button class="btn dark" style="margin-top:12px;margin-right:6px" onclick="productDetails(\''+p.id+'\')">Voir détails</button><button class="btn" style="margin-top:12px" onclick="productDetails(\''+p.id+'\')">Choisir taille / couleur</button></div></article>').join('')}
function productDetails(id){
const p=products.find(x=>x.id===id);if(!p)return;
const imgs=(p.images||[]).map(u=>'<img src="'+esc(u)+'" style="width:82px;height:82px;object-fit:cover;border-radius:10px;border:1px solid #eee">').join('');
const ss=(p.sizes||[]).length?'<label><b>Taille</b><select class="input" id="detail_size"><option value="">Choisir la taille</option>'+(p.sizes||[]).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select></label>':'';
const cc=(p.colors||[]).length?'<label><b>Couleur</b><select class="input" id="detail_color"><option value="">Choisir la couleur</option>'+(p.colors||[]).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select></label>':'';
modal.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px"><h2>'+esc(p.name)+'</h2><button class="btn dark" onclick="closePanel()">×</button></div><div class="row" style="align-items:start"><div><div class="pic" style="height:380px;border-radius:12px">'+(p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'">':'<span>Aucune image</span>')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+imgs+'</div></div><div><p class="muted" style="white-space:pre-wrap">'+esc(p.description||'Aucune description disponible.')+'</p><h3><span class="price">'+money(p.price)+'</span>'+(p.old_price?'<span class="old">'+money(p.old_price)+'</span>':'')+'</h3>'+ss+cc+'<p><b>Stock:</b> '+p.stock+'</p>'+(p.video_url?'<p><a class="btn" href="'+esc(p.video_url)+'" target="_blank">▶ Voir la vidéo</a></p>':'')+'<button class="btn" onclick="addFromDetails(\''+p.id+'\')">Ajouter au panier</button></div></div>';
panel.classList.add('open')}
function filterCat(id){const list=products.filter(p=>p.category_id===id);const g=document.querySelector('#grid,#homegrid');if(g)g.innerHTML=cards(list)}
function searchProducts(q){q=q.toLowerCase();const list=products.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q));const g=document.querySelector('#grid,#homegrid');if(g)g.innerHTML=cards(list)}
function add(id,size=null,color=null){const p=products.find(x=>x.id===id);if(!p)return;if((p.sizes||[]).length&&!size)return alert('Veuillez choisir la taille.');if((p.colors||[]).length&&!color)return alert('Veuillez choisir la couleur.');const key=id+'|'+(size||'')+'|'+(color||'');const x=cart.find(x=>x.key===key);if(x){if(x.qty>=p.stock)return alert('Stock insuffisant');x.qty++}else cart.push({key,id,qty:1,size:size||null,color:color||null});save();alert('Produit ajouté au panier.')}
function save(){localStorage.ms_cart=JSON.stringify(cart);const el=document.querySelector('#count');if(el)el.textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){let rows=cart.map(x=>{const p=products.find(p=>p.id===x.id);return p?'<div class="item"><div style="flex:1"><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' × '+x.qty+'</div></div><button class="btn dark" onclick="removeCart(\''+x.id+'\')">×</button></div>':''}).join('');let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);modal.innerHTML='<h2>Votre panier</h2><div class="items">'+(rows||'<p class="muted">Panier vide.</p>')+'</div><hr><h3>Total produits: '+money(total)+'</h3>'+(cart.length?'<button class="btn" onclick="checkout()">Commander</button>':'')+' <button class="btn dark" onclick="closePanel()">Fermer</button>';panel.classList.add('open')}
function removeCart(id){cart=cart.filter(x=>x.id!==id);save();openCart()}
function checkout(){
const rows=cart.map(x=>{const p=products.find(p=>p.id===x.id);if(!p)return '';return '<div class="item" style="display:block"><b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' × '+x.qty+(x.size?' · Taille: '+esc(x.size):'')+(x.color?' · Couleur: '+esc(x.color):'')+'</div></div>'}).join('');
modal.innerHTML='<h2>Finaliser la commande</h2><div class="items">'+rows+'</div><div class="row"><label>Nom<input class="input" id="n"></label><label>Téléphone<input class="input" id="p"></label></div><div class="row"><label>Ville<input class="input" id="c"></label><label>Adresse<input class="input" id="a"></label></div><label>Note<textarea class="input" id="note"></textarea></label><button class="btn" onclick="sendOrder()">Confirmer la commande → WhatsApp</button> <button class="btn dark" onclick="openCart()">Retour</button>'
}
function addFromDetails(id){const p=products.find(x=>x.id===id);if(!p)return;const size=document.querySelector('#detail_size')?.value||null;const color=document.querySelector('#detail_color')?.value||null;if((p.sizes||[]).length&&!size)return alert('Veuillez choisir la taille.');if((p.colors||[]).length&&!color)return alert('Veuillez choisir la couleur.');add(id,size,color);closePanel()}
async function sendOrder(){
const name=document.querySelector('#n').value.trim(),phone=document.querySelector('#p').value.trim(),city=document.querySelector('#c').value.trim(),address=document.querySelector('#a').value.trim(),note=document.querySelector('#note').value.trim();
if(!name||!phone||!city||!address)return alert('Veuillez remplir les champs obligatoires.');
const items=cart.map(x=>({product_id:x.id,quantity:x.qty,size:x.size||null,color:x.color||null}));
try{const {data,error}=await sb.rpc('create_order',{p_name:name,p_phone:phone,p_city:city,p_address:address,p_notes:note||null,p_items:items});if(error)throw error;
const orderNumber=data.order_number;const lines=cart.map(x=>{const p=products.find(p=>p.id===x.id);return '• '+(p?.name||'Produit')+' × '+x.qty+(x.size?' | Taille: '+x.size:'')+(x.color?' | Couleur: '+x.color:'')}).join('\n');
const waText='Bonjour Moustapha Shop 👋\n\nNouvelle commande #'+orderNumber+'\n\n'+lines+'\n\nNom: '+name+'\nTéléphone: '+phone+'\nVille: '+city+'\nAdresse: '+address+(note?'\nNote: '+note:'')+'\n\nTotal: '+money(data.total);
cart=[];save();const waUrl='https://wa.me/212664624776?text='+encodeURIComponent(waText);modal.innerHTML='<div class="msg success"><h2>Commande enregistrée ✅</h2><p>La commande <b>'+esc(orderNumber)+'</b> est prête.</p><p>Ouverture de WhatsApp…</p></div>';setTimeout(()=>{window.location.href=waUrl},350)}catch(e){alert(e.message||e)}}function contact(){app.innerHTML='<section class="section wrap"><h1>Contact</h1><p class="muted">Casablanca, Hay El Hassani, Rue 80</p><p><a class="btn" href="https://wa.me/212664624776" target="_blank">WhatsApp</a> <a class="btn dark" href="tel:+212664624776">+212 664-624776</a></p><p class="muted">Livraison Casablanca : 20 DH · Hors Casablanca : 35 DH</p></section>'}
async function adminProducts(){
  const s=(await sb.auth.getSession()).data.session;
  if(!s){location.hash='#admin';return}
  const {data:isA}=await sb.from('admin_users').select('user_id').eq('user_id',s.user.id).maybeSingle();
  if(!isA){await sb.auth.signOut();location.hash='#admin';return}
  const {data:ps,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
  const list=ps||[];
  app.innerHTML='<section class="section wrap admin" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h1>Produits</h1><div><button class="btn" onclick="productForm()">+ Ajouter produit</button> <button class="btn dark" onclick="location.hash=\'#admin\'">← Commandes</button></div></div><div id="productList" class="grid" style="margin-top:20px">'+(error?'<p class="danger">'+esc(error.message)+'</p>':list.map(productAdminCard).join('')||'<p class="muted">Aucun produit.</p>')+'</div></section>';
}
function productAdminCard(p){
  const img=p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'" style="width:100%;height:220px;object-fit:cover">':'<div class="pic">Aucune image</div>';
  return '<article class="card"><div>'+img+'</div><div class="body"><h3>'+esc(p.name)+'</h3><p><b>'+money(p.price)+'</b> · Stock: '+p.stock+'</p><p class="muted">'+esc(p.description||'')+'</p><p class="muted">Tailles: '+esc((p.sizes||[]).join(', ')||'—')+' · Couleurs: '+esc((p.colors||[]).join(', ')||'—')+'</p><p>'+(p.is_active?'<span class="success">Actif</span>':'<span class="danger">Inactif</span>')+(p.is_featured?' · ⭐ Vedette':'')+(p.is_new?' · 🆕 Nouveau':'')+'</p><button class="btn" onclick="productForm(\''+p.id+'\')">Modifier</button> <button class="btn dark" onclick="toggleProduct(\''+p.id+'\','+(!p.is_active)+')">'+(p.is_active?'Désactiver':'Activer')+'</button> <button class="btn dark" onclick="deleteProduct(\''+p.id+'\')">Supprimer</button></div></article>';
}

el>Téléphone<input class="input" id="st_phone" value="'+esc(setting('phone','+212 664-624776'))+'"></label><label>WhatsApp (sans +)<input class="input" id="st_wa" value="'+esc(setting('whatsapp','212664624776'))+'"></label></div><label>Adresse<input class="input" id="st_addr" value="'+esc(setting('address',''))+'"></label><div class="row"><label>Instagram<input class="input" id="st_ig" value="'+esc(setting('instagram_url',''))+'"></label><label>TikTok<input class="input" id="st_tt" value="'+esc(setting('tiktok_url',''))+'"></label></div><label>Facebook<input class="input" id="st_fb" value="'+esc(setting('facebook_url',''))+'"></label><h2>🚚 Livraison</h2><div class="row"><label>Casablanca (DH)<input class="input" type="number" id="st_ship1" value="'+esc(setting('shipping_casablanca','20'))+'"></label><label>Autres villes (DH)<input class="input" type="number" id="st_ship2" value="'+esc(setting('shipping_other','35'))+'"></label></div><button class="btn" onclick="saveSiteSettings()">💾 Enregistrer les modifications</button><div class="msg">Les modifications sont enregistrées dans Supabase et seront visibles sur le site après actualisation.</div></div></section>'}
async function previewLogo(input){const f=input?.files?.[0];if(!f)return;const url=URL.createObjectURL(f);const box=document.querySelector('#logoPreview');if(box)box.innerHTML='<img src="'+url+'" style="max-width:260px;max-height:110px;object-fit:contain;border-radius:8px" alt="Aperçu logo">'}
async function saveSiteSettings(){const vals={primary_color:st_pink.value,accent_color:st_gold.value,shop_name:st_shop.value.trim(),logo_url:setting('logo_url',''),hero_title:st_ht.value.trim(),hero_subtitle:st_hs.value.trim(),hero_description:st_hd.value.trim(),phone:st_phone.value.trim(),whatsapp:st_wa.value.trim(),address:st_addr.value.trim(),instagram_url:st_ig.value.trim(),tiktok_url:st_tt.value.trim(),facebook_url:st_fb.value.trim(),shipping_casablanca:st_ship1.value,shipping_other:st_ship2.value};const logoFile=document.querySelector('#st_logo_file')?.files?.[0];try{if(logoFile){if(logoFile.size>2*1024*1024)return alert('Logo trop lourd. Maximum 2 MB.');vals.logo_url=await uploadMedia(logoFile,'branding')}}catch(e){return alert('Erreur upload du logo: '+(e.message||e))}const rows=Object.entries(vals).map(([key,value])=>({key,value}));const {error}=await sb.from('site_settings').upsert(rows,{onConflict:'key'});if(error)return alert(error.message);settings={...settings,...vals};applyTheme();siteText();alert('Informations, thème et logo enregistrés ✅');location.hash='#admin/settings'}
async function productForm(id){

async function uploadMedia(file,folder){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  const {error}=await sb.storage.from('media').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  const {data}=sb.storage.from('media').getPublicUrl(path);
  return data.publicUrl;
}
async function saveProduct(id){
  const existing=window.currentEditProduct||{};
  const name=document.querySelector('#pn').value.trim(),price=Number(document.querySelector('#pp').value),stock=Math.max(0,Number(document.querySelector('#ps').value||0));
  if(!name||!price)return alert('Nom et prix obligatoires.');
  const btn=document.querySelector('button[onclick^="saveProduct"]'); if(btn){btn.disabled=true;btn.textContent='Envoi...'}
  try{
    const imageFiles=[...(document.querySelector('#pfiles').files||[])];
    const videoFile=document.querySelector('#pvideo').files?.[0];
    const uploadedImages=[];
    for(const f of imageFiles) uploadedImages.push(await uploadMedia(f,'products'));
    let videoUrl=existing.video_url||null;
    if(videoFile) videoUrl=await uploadMedia(videoFile,'videos');
    const payload={name,description:document.querySelector('#pd').value.trim(),price,old_price:document.querySelector('#po').value?Number(document.querySelector('#po').value):null,category_id:document.querySelector('#pc').value||null,stock,video_url:videoUrl,colors:document.querySelector('#pcol').value.split(/[,;]+/).map(x=>x.trim()).filter(Boolean),sizes:document.querySelector('#pz').value.split(/[,;]+/).map(x=>x.trim()).filter(Boolean),images:uploadedImages.length?uploadedImages:(existing.images||[]),is_active:document.querySelector('#pa').checked,is_new:document.querySelector('#pnw').checked,is_featured:document.querySelector('#pf').checked};
    const q=id?sb.from('products').update(payload).eq('id',id):sb.from('products').insert(payload);
    const {error}=await q;if(error)throw error;
    alert('Produit enregistré avec succès.');
    location.hash='#admin/products';
  }catch(e){
    alert('Erreur upload/enregistrement: '+(e.message||e));
    if(btn){btn.disabled=false;btn.textContent='Enregistrer'}
  }
}
