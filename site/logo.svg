  <path d="M164 70h108" stroke="#ffb2cc" stroke-width="3" opacity=".8"/>
  <path d="M265 68h107" stroke="#fff" stroke-width="3" opacity=".9"/>
  <text x="260" y="177" text-anchor="middle" fill="#ed2870" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="3">MOUSTAPHA SHOP</text>
