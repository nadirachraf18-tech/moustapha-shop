<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-labelledby="title desc">
  <title id="title">Moustapha Shop</title>
  <desc id="desc">Logo Moustapha Shop : deux sacs de shopping rose et ivoire avec anses dorées, suivis du nom de la boutique.</desc>
  <defs>
    <linearGradient id="pinkBag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff78a9"/>
      <stop offset="1" stop-color="#e91e68"/>
    </linearGradient>
    <linearGradient id="ivoryBag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f0d9e3"/>
    </linearGradient>
    <linearGradient id="goldHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8df9d"/>
      <stop offset="1" stop-color="#bd8730"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldHandle)" stroke-width="5" stroke-linecap="round">
    <path d="M34 57c0-24 9-36 22-36s22 12 22 36"/>
    <path d="M83 55c0-23 9-35 22-35s22 12 22 35"/>
  </g>
  <path d="M22 55h69l-7 61H31z" fill="url(#pinkBag)" stroke="#d91d61" stroke-width="1.8"/>
  <path d="M82 53h68l-14 63H68z" fill="url(#ivoryBag)" stroke="#e5c5d2" stroke-width="1.8"/>
  <path d="M23 60h67" stroke="#ffb2cc" stroke-width="2.5" opacity=".9"/>
  <path d="M84 58h64" stroke="#fff" stroke-width="2.5" opacity=".9"/>
  <text x="174" y="91" fill="#ed2870" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700" letter-spacing="1.5">Moustapha</text>
  <text x="177" y="123" fill="#3a2931" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="8">SHOP</text>
</svg>