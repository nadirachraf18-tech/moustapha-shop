<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" role="img" aria-labelledby="title desc">
  <title id="title">Moustapha Shop</title>
  <desc id="desc">Deux sacs de shopping rose et ivoire avec anses dorées, au-dessus du nom Moustapha Shop.</desc>
  <defs>
    <linearGradient id="pinkBag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff75a8"/>
      <stop offset="1" stop-color="#e91e68"/>
    </linearGradient>
    <linearGradient id="ivoryBag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f2dce5"/>
    </linearGradient>
    <linearGradient id="goldHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d98c"/>
